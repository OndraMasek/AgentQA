name: AgentQA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: agentqa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run AgentQA
        run: npx --yes agentqa@latest run --ci --verbose
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentqa-run
          path: |
            agentqa-report.json
            agentqa-report.md
            .agentqa-cache/
          if-no-files-found: ignore
          retention-days: 14
